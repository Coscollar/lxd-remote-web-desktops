{% extends "base.html" %}
{% block content %}
<div class="login-card">
  <h2>{% if admin %}Acceso administrador{% else %}Acceso al laboratorio{% endif %}</h2>
  <p>Introduce tu correo electrónico para recibir un enlace de acceso.</p>
  {# F3.1: el modo admin viaja por atributo DOM; el JS es estático (CSP sin inline). #}
  <form id="login-form" data-admin="{{ 'true' if admin else 'false' }}">
    <input type="email" id="email" name="email" placeholder="tu@correo.es" required autofocus>
    <button type="submit">Enviar enlace</button>
  </form>
  <p id="msg" class="msg"></p>
</div>
<script src="/static/js/login.js" defer></script>
{% endblock %}
