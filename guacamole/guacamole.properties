# FASE 4 — Guacamole Server config: bind loopback + header auth + mysql.
# Sin este archivo, Guacamole arranca con default 0.0.0.0:8080.

# guacd (loopback)
guacd-hostname: 127.0.0.1
guacd-port: 4822

# MySQL backend (JDBC)
mysql-hostname: 127.0.0.1
mysql-port: 3306
mysql-database: guacamole
mysql-username: guacamole
mysql-password: ${GUAC_MYSQL_PASS}

# Header Auth Extension (dev): confía en Remote-User de Nginx.
# HEADER_TRUSTED_ORIGINS se pasa vía env en docker-compose.
header-client-id: Remote-User

# Sin user-mapping.xml (JDBC backend, 0 entradas estáticas)