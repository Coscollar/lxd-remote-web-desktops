# FASE 6.5 — Reverse proxy TLS multi-ruta.
# Identidad SOLO desde JWT (auth_request a provision-api /verify).
# Nginx SIEMPRE sobreescribe Remote-User; el cliente no puede inyectarlo.
# proxy_pass apunta a Guacamole Server (8080) solo para /desktop/,
# NUNCA a guacd:4822 ni VM:3389. Apps stateless van HTTP directo (no guacd).

server {
    listen 80;
    server_name lab.<dominio>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lab.<dominio>;

    ssl_certificate     /etc/letsencrypt/live/lab.<dominio>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.<dominio>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           no-referrer always;

    # --- Endpoints internos de auth_request (3) ---------------------------
    location = /verify {
        internal;
        proxy_pass http://127.0.0.1:8000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Requested-Lab $requested_lab;
        proxy_set_header X-Internal $internal_token;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /verify_app {
        internal;
        proxy_pass http://127.0.0.1:8000/verify/app;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Requested-App $app_id;
        proxy_set_header X-Internal $internal_token;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /verify_admin {
        internal;
        proxy_pass http://127.0.0.1:8000/admin/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Internal $internal_token;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # --- Locations PÚBLICAS (sin auth_request) -----------------------------
    location = / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location = /login {
        proxy_pass http://127.0.0.1:8000/login;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location /static/ {
        root /opt/provision/web;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- Locations con auth_request /verify (alumno) -----------------------
    location = /dashboard {
        auth_request /verify;
        proxy_pass http://127.0.0.1:8000/dashboard;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location /lab/ {
        auth_request /verify;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location /api/ {
        auth_request /verify;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # --- /desktop/{lab} → Guacamole (solo si scope=lab) -------------------
    location ~ ^/desktop/(?<lab>[a-z0-9-]+)(/.*)?$ {
        set $requested_lab $lab;
        auth_request /verify;
        auth_request_set $lab_alumno $upstream_http_x_lab_alumno;
        auth_request_set $lab_name   $upstream_http_x_lab_name;
        auth_request_set $lab_scope  $upstream_http_x_lab_scope;

        # Si scope != lab → redirect al dashboard (no 401: está autenticado)
        if ($lab_scope != "lab") { return 302 /dashboard; }
        # Cross-tenant: el lab del path debe ser el lab activo del JWT
        if ($lab_name != $lab) { return 403; }

        proxy_set_header Remote-User       "$lab_alumno-$lab_name";
        proxy_set_header X-Lab-Alumno      $lab_alumno;
        proxy_set_header X-Lab-Name        $lab_name;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host              $host;
        proxy_set_header X-Internal        $internal_token;

        # proxy a Guacamole Server (NUNCA a guacd:4822 ni a VM:3389).
        proxy_pass http://127.0.0.1:8080/guacamole/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # --- /apps/{app_id}/ → app stateless (auth_request /verify_app READ-ONLY) ---
    location ^~ /apps/(?<app_id>[a-z0-9-]+)/ {
        auth_request /verify_app;
        auth_request_set $app_target $upstream_http_x_app_target;
        if ($app_target = "") { return 503; }

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /apps/$app_id;
        proxy_set_header X-Internal        $internal_token;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;

        resolver 10.50.10.1 valid=1s ipv6=off;
        rewrite ^/apps/([a-z0-9-]+)/(.*)$ /$2 break;
        proxy_pass http://$app_target;
        limit_req zone=appuser burst=20 nodelay;
    }

    # --- /admin/* → provision-api (auth_request /verify_admin) -------------
    location = /admin/login {
        proxy_pass http://127.0.0.1:8000/admin/login;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location /admin {
        auth_request /verify_admin;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location /admin/ {
        auth_request /verify_admin;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/lab.access.log lab_safe;
}

# Catch-all: cualquier otro Host/SNI en :443 → 444 (sin respuesta).
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/lab.<dominio>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.<dominio>/privkey.pem;
    return 444;
}